name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Seed SQL is up to date
        run: npm run seed:sql -w @wcic/content && git diff --exit-code supabase/seed.sql
      - name: App bundles for web
        working-directory: apps/mobile
        run: npx expo export --platform web
        env:
          EXPO_OFFLINE: 1

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test the recommend function
        working-directory: supabase/functions
        run: |
          deno check --config deno.json recommend/index.ts
          deno test --config deno.json --allow-env recommend/
